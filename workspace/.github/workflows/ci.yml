# v0.1
# PathMiner CI — package skeleton and import-boundary guard
#
# Trigger: every push and pull request to main and any ai/session-* branch.
# Steps:
#   1. Install the pathminer package in editable mode (no optional deps needed
#      for import-boundary tests; PySide6 is GUI-only and excluded in CI).
#   2. Run the pytest suite — includes ARCH-002 import-boundary tests.
#   3. Run the v0.13 headless selftest directly against tools/ (unchanged
#      behaviour check; requires no package install because it is self-contained).
#
# The selftest step will grow to cover the full regression suite in later
# sessions (QA-004 CI automation deferred from Session 01).
#
# NOTE: the IP5385 real-board regression requires the committed KiCad project
# files.  Those are present in ai_reference/kicad_project_example/ and the
# selftest locates them automatically; no external fixture download needed.

name: CI

on:
  push:
    branches:
      - main
      - "ai/session-*"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.12"]
        include:
          # macOS check on the primary version only (mirrors developer machines)
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pathminer package (editable, no optional deps)
        working-directory: workspace
        run: |
          python -m pip install --upgrade pip
          # Install in editable mode so imports resolve from the working tree.
          # Omit [gui] to avoid pulling PySide6 into CI — GUI tests are not
          # run here until Session 16+ (UI build-out).
          pip install -e ".[dev]"

      - name: Run pytest (import-boundary guard + unit tests)
        working-directory: workspace
        run: python -m pytest -q

      - name: Run v0.13 headless selftest (118/118 acceptance vectors)
        working-directory: workspace
        run: python tools/pcb_trace_resistance.py --selftest

  # ---------------------------------------------------------------------------
  # Lint / static checks (non-blocking in early sessions; promoted to required
  # once a majority of sessions are integrated — see QA-009 release gates).
  # ---------------------------------------------------------------------------
  lint:
    name: "Lint (non-blocking)"
    runs-on: ubuntu-latest
    continue-on-error: true          # advisory only until QA-009
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff
      - name: ruff check workspace/pathminer workspace/tests
        working-directory: workspace
        run: ruff check pathminer tests --select E,W,F --ignore E501 || true
